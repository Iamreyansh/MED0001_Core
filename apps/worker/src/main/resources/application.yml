spring:
  application:
    name: med0001-worker
  main:
    web-application-type: none
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medmate}
    username: ${SPRING_DATASOURCE_USERNAME:medmate}
    password: ${SPRING_DATASOURCE_PASSWORD:medmate}

medmate:
  s3:
    bucket: ${MEDMATE_S3_BUCKET:med0001-local-uploads}
  sqs:
    queue-url: ${MEDMATE_SQS_DOMAIN_EVENTS_URL:}
    # kyc-malware-queue-url: set only via MEDMATE_SQS_KYC_MALWARE_URL in ECS (staging/prod)
  mfa:
    encryption-key-base64: ${MEDMATE_MFA_ENCRYPTION_KEY_BASE64:}
  payment:
    encryption-key-base64: ${MEDMATE_PAYMENT_ENCRYPTION_KEY_BASE64:}
  fcm:
    project-id: ${MEDMATE_FCM_PROJECT_ID:}
    service-account-json: ${MEDMATE_FCM_SERVICE_ACCOUNT_JSON:}
  twilio:
    account-sid: ${MEDMATE_TWILIO_ACCOUNT_SID:}
    auth-token: ${MEDMATE_TWILIO_AUTH_TOKEN:}
    api-key: ${MEDMATE_TWILIO_API_KEY:}
    from-number: ${MEDMATE_TWILIO_FROM_NUMBER:}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId}]"
