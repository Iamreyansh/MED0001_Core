spring:
  datasource:
    url: jdbc:h2:mem:medmate;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

logging:
  level:
    root: INFO

medmate:
  internal:
    service-token: local-internal-wallet-token
  inventory:
    growth-features-enabled: true
    jobs:
      enabled: true
    po-dispatch:
      whatsapp-enabled: false
      email-enabled: false
  pos:
    starter-features-enabled: true
    growth-features-enabled: true
    notifications-enabled: true
    jobs:
      enabled: true
  kyc:
    webhook-secret: local-kyc-webhook-secret
  cashfree:
    webhook-secret: test_cashfree_webhook_secret
    payouts-webhook-secret: local-cashfree-payouts-webhook-secret
