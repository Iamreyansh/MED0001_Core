# Local run against Podman Compose (postgres + redis on localhost)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medmate
    username: medmate
    password: medmate
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: INFO
    com.nammamedmate: INFO

medmate:
  cors:
    # Credentialed browser calls from local frontends (Vite/Next/etc.). Off in staging/prod.
    allow-localhost: true
