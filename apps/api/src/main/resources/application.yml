server:
  port: 8080

spring:
  application:
    name: med0001-api
  datasource:
    url: jdbc:postgresql://localhost:5432/medmate
    username: medmate
    password: medmate
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

medmate:
  s3:
    bucket: namma-medmate-uploads-local
  jwt:
    private-key-pem: ""
    public-key-pem: ""
  mfa:
    # 32 zero bytes, Base64 — local/dev/IT only. Staging/prod reject this and require Secrets Manager.
    encryption-key-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  wallet:
    # Rs 1,000 — platform config key max_wallet_credit_per_transaction (EPIC-021 STORY-004 later)
    max-credit-paise: 100000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [requestId=%X{requestId}]"
