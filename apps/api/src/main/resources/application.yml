server:
  port: 8080

spring:
  application:
    name: med0001-api
  servlet:
    multipart:
      # Product rule: max 10 MB per upload (KYC and future uploads)
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/medmate
    username: medmate
    password: medmate
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

medmate:
  catalogue:
    jobs:
      enabled: true
  rider:
    aadhaar-kyc-enabled: false
    auto-assign-enabled: true
    assignment-timeout-delay-ms: 30000
    jobs:
      enabled: true
  pharmacy:
    jobs:
      enabled: true
    catalogue-pause:
      poll-delay-ms: 60000
    zones:
      low-pharmacy-warning-threshold: 3
  s3:
    # Local only. Staging/prod: MEDMATE_S3_BUCKET=med0001-{env}-uploads-105927215604
    bucket: med0001-local-uploads
  cdn:
    # Public CDN fronting uploads prefixes (avatars/, products/, …). Staging uses
    # https://cdn.staging.nammamedmate.com; prod uses https://cdn.nammamedmate.com.
    base-url: https://cdn.nammamedmate.com
  referral:
    join-base-url: https://nammamedmate.com/join
  jwt:
    private-key-pem: ""
    public-key-pem: ""
  mfa:
    # 32 zero bytes, Base64 — local/dev/IT only. Staging/prod reject this and require Secrets Manager.
    encryption-key-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  payment:
    # Dedicated AES key for saved UPI/token ciphertext. Blank → falls back to MFA key (local only).
    encryption-key-base64: ""
  wallet:
    # Rs 1,000 — platform config key max_wallet_credit_per_transaction (EPIC-021 STORY-004 later)
    max-credit-paise: 100000
  razorpay:
    # Blank → StubRazorpayVpaClient (local/CI). Staging/prod: MEDMATE_SECRETS_RAZORPAY_ARN
    # (Secrets Manager JSON key_id / key_secret / webhook_secret).
    key-id: ""
    key-secret: ""
  razorpayx:
    # Local/dev only — staging/prod: MEDMATE_SECRETS_RAZORPAYX_ARN (JSON webhook_secret)
    webhook-secret: local-razorpayx-webhook-secret
  kyc:
    # ponytail: feature flag via property, not EPIC-021 settings service (simpler for now)
    auto-verification-enabled: false
    # Local/dev only — staging/prod: MEDMATE_SECRETS_KYC_ARN (JSON webhook_secret)
    webhook-secret: local-kyc-webhook-secret
    jobs:
      enabled: true
      retry-delay-ms: 30000

  outbox:
    dispatch:
      enabled: true
      delay-ms: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [requestId=%X{requestId}]"
