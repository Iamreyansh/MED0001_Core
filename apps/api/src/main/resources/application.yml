server:
  port: 8080

spring:
  application:
    name: med0001-api
  servlet:
    multipart:
      # Slightly above product 10 MB so domain can return FILE_TOO_LARGE (422) before servlet hard-fail
      max-file-size: 11MB
      max-request-size: 11MB
  datasource:
    url: jdbc:postgresql://localhost:5432/medmate
    username: medmate
    password: medmate
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

medmate:
  feature-flags:
    write-environment: production
  platform-config:
    # Immutable keys blocked when this is production (STORY-004).
    environment: production
  inventory:
    # Free/Starter default; local profile enables Growth features for online visibility.
    growth-features-enabled: false
    jobs:
      enabled: true
    po-dispatch:
      # Stub channel availability until EPIC-017 notification consumer is live.
      whatsapp-enabled: true
      email-enabled: true
  pos:
    # Free-tier bootstrap: Starter/Growth POS feature gates (offers etc. in later stories).
    starter-features-enabled: false
    growth-features-enabled: false
    # Local/default share stub succeeds; set false to force CHANNEL_UNAVAILABLE.
    notifications-enabled: true
    jobs:
      enabled: true
  catalogue:
    jobs:
      enabled: true
  rider:
    aadhaar-kyc-enabled: false
    auto-assign-enabled: true
    assignment-timeout-delay-ms: 30000
    jobs:
      enabled: true
  pharmacy:
    jobs:
      enabled: true
    catalogue-pause:
      poll-delay-ms: 60000
    zones:
      low-pharmacy-warning-threshold: 3
  prescription:
    jobs:
      enabled: true
    # Local store uses java.io.tmpdir/medmate-prescriptions (LocalPrescriptionObjectStore).
    # Staging/prod use S3PrescriptionObjectStore.
  s3:
    # Local only. Staging/prod: MEDMATE_S3_BUCKET=med0001-{env}-uploads-105927215604
    bucket: med0001-local-uploads
    accounting-exports-enabled: false
  cdn:
    # Public CDN fronting uploads prefixes (avatars/, products/, …). Staging uses
    # https://cdn.staging.nammamedmate.com; prod uses https://cdn.nammamedmate.com.
    base-url: https://cdn.nammamedmate.com
  referral:
    join-base-url: https://nammamedmate.com/join
  jwt:
    private-key-pem: ""
    public-key-pem: ""
  mfa:
    # 32 zero bytes, Base64 — local/dev/IT only. Staging/prod reject this and require Secrets Manager.
    encryption-key-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  payment:
    # Dedicated AES key for saved UPI/token ciphertext. Blank → falls back to MFA key (local only).
    encryption-key-base64: ""
  wallet:
    # Rs 1,000 — platform config key max_wallet_credit_per_transaction (EPIC-021 STORY-004 later)
    max-credit-paise: 100000
  internal:
    # Blank → S2S endpoints fail closed. Local: application-local.yml.
    service-token: ""
  razorpay:
    # Blank keys → StubRazorpayClient (local/CI). Staging/prod: ECS secret env
    # MEDMATE_RAZORPAY_{KEY_ID,KEY_SECRET,WEBHOOK_SECRET} (see stacks/*/api.tf).
    key-id: ""
    key-secret: ""
    webhook-secret: ""
    # TEST|LIVE — live keys still hit api.razorpay.com/v1; mode is an audit flag (AC-008).
    mode: TEST
  razorpayx:
    # Blank keys → StubRazorpayXClient. Staging/prod: MEDMATE_RAZORPAYX_*.
    key-id: ""
    key-secret: ""
    # Local: application-local.yml. Staging/prod: MEDMATE_RAZORPAYX_WEBHOOK_SECRET.
    webhook-secret: ""
  maps:
    # Segregated Google Maps keys (AC-008). Blank → StubMapsClient for that capability.
    geocode:
      api-key: ""
    distance-matrix:
      api-key: ""
    directions:
      api-key: ""
  gstn:
    # Blank → StubGstnClient. Staging/prod: MEDMATE_GSTN_API_KEY.
    api-key: ""
    base-url: https://gstn.example.invalid/v1
  digilocker:
    # Blank client-id/secret → StubDigiLockerClient.
    client-id: ""
    client-secret: ""
    authorize-url: https://api.digitallocker.gov.in/public/oauth2/1/authorize
    token-url: https://api.digitallocker.gov.in/public/oauth2/1/token
  drug-registry:
    api-key: ""
    base-url: https://drug-registry.example.invalid/v1
  fssai:
    api-key: ""
    base-url: https://fssai.example.invalid/v1
  gsp:
    # Blank client-id/secret → StubGspClient (local/CI). Staging/prod: MEDMATE_GSP_*.
    client-id: ""
    client-secret: ""
    base-url: https://gsp.example.invalid/v1
  zoho:
    # Blank → StubZohoBooksClient. Staging/prod: MEDMATE_ZOHO_CLIENT_*.
    client-id: ""
    client-secret: ""
    accounts-base-url: https://accounts.zoho.in
    books-base-url: https://www.zohoapis.in/books/v3
  accounting:
    # Hex (64 chars) or Base64 AES-256 key for Zoho OAuth token ciphertext. Blank → local zero key.
    token-cipher-key: ""
  teleconsult:
    # Local blank → zero key. Staging/prod: SM teleconsult_encryption_key_base64 or MFA fallback (fail-closed).
    encryption-key-base64: ""
    jobs:
      enabled: true
    auto-cancel:
      delay-ms: 60000
  integration:
    payout-retry:
      enabled: true
    payout-retry-delay-ms: 300000
    gsp-token-refresh:
      enabled: true
    gsp-token-refresh-delay-ms: 3600000
    accounting-auto-sync:
      enabled: true
    accounting-auto-sync-delay-ms: 60000
    comms-health-check:
      enabled: true
    comms-health-check-delay-ms: 300000
    comms-daily-reset:
      enabled: true
    accounting:
      sync-poller:
        enabled: true
      sync-poll-delay-ms: 2000
  kyc:
    # ponytail: feature flag via property, not EPIC-021 settings service (simpler for now)
    auto-verification-enabled: false
    # Local: application-local.yml. Staging/prod: MEDMATE_KYC_WEBHOOK_SECRET.
    webhook-secret: ""
    jobs:
      enabled: true
      retry-delay-ms: 30000
  medicine-schedule:
    jobs:
      enabled: true
    due-dispatch-delay-ms: 60000
  crm:
    enforce-module-matrix: true
  automation:
    seed:
      # AC-007: ApplicationRunner initializes seed rules on api boot (idempotent).
      initialize-on-startup: true
  observability:
    jobs:
      enabled: true

  outbox:
    dispatch:
      enabled: true
      delay-ms: 5000
  sqs:
    queue-url: ${MEDMATE_SQS_DOMAIN_EVENTS_URL:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [requestId=%X{requestId}]"
