name: terraform-force-unlock

on:
  workflow_dispatch:
    inputs:
      environment:
        description: staging or prod
        required: true
        type: choice
        options:
          - staging
          - prod
      lock_id:
        description: Terraform lock ID from CI logs
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  unlock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub Environment names: staging | production (stack dir remains prod)
    environment: ${{ inputs.environment == 'prod' && 'production' || inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Require AWS_DEPLOY_ROLE_ARN
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::vars.AWS_DEPLOY_ROLE_ARN is empty"
            exit 1
          fi
      - name: Validate lock_id
        run: |
          LOCK_ID='${{ inputs.lock_id }}'
          if [ -z "$LOCK_ID" ]; then
            echo "::error::lock_id is required"
            exit 1
          fi
          echo "Unlock requested by ${{ github.actor }}"
          echo "environment=${{ inputs.environment }}"
          echo "lock_id=${LOCK_ID}"
      - uses: ./.github/actions/setup-terraform-aws
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - name: Force unlock
        run: make tf-unlock ENV=${{ inputs.environment }} LOCK_ID=${{ inputs.lock_id }}
