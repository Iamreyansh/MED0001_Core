name: quality-gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: qg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - name: Spotless, tests, JaCoCo 100%, SpotBugs, ArchUnit
        run: make check
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          retention-days: 14
          if-no-files-found: ignore
          path: |
            **/build/reports/jacoco/**
            **/build/reports/spotbugs/**

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: bash -n scripts
        run: make scripts-syntax

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
              - 'scripts/deploy-ecs.sh'
              - 'scripts/docker-push.sh'
              - 'Makefile'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Fmt + validate (flattened staging + prod stacks)
        run: |
          make tf-fmt-check
          make tf-validate
      - name: Require AWS deploy role when infra changed
        if: steps.filter.outputs.infra == 'true'
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::infra changed but vars.AWS_DEPLOY_ROLE_ARN is empty."
            exit 1
          fi
      - name: Configure AWS OIDC
        if: steps.filter.outputs.infra == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Terraform plan staging + prod (S3 state/lock)
        if: steps.filter.outputs.infra == 'true'
        run: |
          make tf-init ENV=staging
          make tf-plan ENV=staging TF_ARGS="-no-color -out=tfplan-staging"
          terraform -chdir=infra/terraform/stacks/staging show -no-color tfplan-staging \
            > "$GITHUB_WORKSPACE/tfplan-staging.txt"
          make tf-init ENV=prod
          make tf-plan ENV=prod TF_ARGS="-no-color -out=tfplan-prod"
          terraform -chdir=infra/terraform/stacks/prod show -no-color tfplan-prod \
            > "$GITHUB_WORKSPACE/tfplan-prod.txt"
      - name: Upload terraform plan
        if: steps.filter.outputs.infra == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans
          retention-days: 7
          if-no-files-found: error
          path: |
            tfplan-staging.txt
            tfplan-prod.txt
