name: quality-gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: qg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_S3_BUCKET: med0001-gha-ci-105927215604
  AWS_REGION: ap-south-1

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Same-repo PR or dispatch — configure AWS OIDC for S3 cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN != '' && vars.AWS_CI_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: ./.github/actions/setup-java
        with:
          restore-s3-cache: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'true' || 'false' }}
      - name: Pre-pull Testcontainers images
        run: |
          docker pull postgis/postgis:16-3.4 &
          docker pull redis:7-alpine &
          wait
      - name: Bruno collection + acceptance matrix
        run: make bruno-check
      - name: Spotless, unit + integration tests, JaCoCo 100%, SpotBugs, ArchUnit
        run: make check
      - name: OWASP dependency analysis
        run: make dependency-check
      - name: Filesystem vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Save Gradle cache to S3
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: scripts/ci-gradle-s3-cache.sh save
      - name: Upload quality reports to S3
        if: failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        run: |
          DEST="s3://${CI_S3_BUCKET}/reports/${{ github.run_id }}/"
          aws s3 sync . "$DEST" \
            --exclude '*' \
            --include '**/build/reports/jacoco/**' \
            --include '**/build/reports/spotbugs/**' \
            --include '**/build/reports/tests/test/**' \
            --include '**/build/reports/tests/integrationTest/**' \
            || true
          echo "Reports (if any): ${DEST}"

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (no GitHub Actions cache/artifact)
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/${ARCHIVE}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          echo "${GITLEAKS_SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: bash -n scripts
        run: make scripts-syntax

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
              - 'scripts/deploy-ecs.sh'
              - 'scripts/docker-push.sh'
              - 'Makefile'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Fmt + validate (flattened staging + prod stacks)
        run: |
          make tf-fmt-check
          make tf-validate
      - name: Require AWS deploy role when infra changed
        if: steps.filter.outputs.infra == 'true'
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::infra changed but vars.AWS_DEPLOY_ROLE_ARN is empty."
            exit 1
          fi
      - name: Configure AWS OIDC
        if: steps.filter.outputs.infra == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform plan staging + prod (S3 state/lock)
        if: steps.filter.outputs.infra == 'true'
        run: |
          make tf-init ENV=staging
          make tf-plan ENV=staging TF_ARGS="-no-color -out=tfplan-staging"
          terraform -chdir=infra/terraform/stacks/staging show -no-color tfplan-staging \
            > "$GITHUB_WORKSPACE/tfplan-staging.txt"
          make tf-init ENV=prod
          make tf-plan ENV=prod TF_ARGS="-no-color -out=tfplan-prod"
          terraform -chdir=infra/terraform/stacks/prod show -no-color tfplan-prod \
            > "$GITHUB_WORKSPACE/tfplan-prod.txt"
      - name: Upload terraform plans to S3
        if: steps.filter.outputs.infra == 'true'
        continue-on-error: true
        run: |
          DEST="s3://${CI_S3_BUCKET}/tfplans/${{ github.run_id }}/"
          if ! aws s3api head-bucket --bucket "$CI_S3_BUCKET" >/dev/null 2>&1; then
            echo "CI bucket missing — skip plan upload (created on next staging apply)"
            exit 0
          fi
          aws s3 cp tfplan-staging.txt "${DEST}tfplan-staging.txt"
          aws s3 cp tfplan-prod.txt "${DEST}tfplan-prod.txt"
          echo "Plans: ${DEST}"
