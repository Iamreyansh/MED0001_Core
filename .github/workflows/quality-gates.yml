name: quality-gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Spotless, tests, JaCoCo 100%, SpotBugs, ArchUnit
        run: ./gradlew check -x dependencyCheckAnalyze --no-daemon
      - name: OWASP dependency check
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        continue-on-error: true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/build/reports/jacoco/**
            **/build/reports/spotbugs/**
            build/reports/dependency-check*

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
      - uses: hashicorp/setup-terraform@v3
        if: steps.filter.outputs.infra == 'true'
        with:
          terraform_version: "1.10.5"
      - name: Fmt + validate
        if: steps.filter.outputs.infra == 'true'
        run: |
          terraform fmt -check -recursive infra/terraform
          (cd infra/terraform/stacks/staging && terraform init -backend=false && terraform validate)
          (cd infra/terraform/stacks/prod && terraform init -backend=false && terraform validate)
      - name: Configure AWS OIDC
        if: steps.filter.outputs.infra == 'true' && vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Terraform plan staging
        if: steps.filter.outputs.infra == 'true' && vars.AWS_DEPLOY_ROLE_ARN != ''
        working-directory: infra/terraform/stacks/staging
        run: |
          rm -rf .terraform
          terraform init
          terraform plan -no-color
