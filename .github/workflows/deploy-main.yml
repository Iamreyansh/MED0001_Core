name: deploy-main

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  CI_S3_BUCKET: med0001-gha-ci-105927215604
  STAGING_HEALTH_URL: https://core.api.staging.nammamedmate.com/api/v1/health

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require AWS_DEPLOY_ROLE_ARN
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::vars.AWS_DEPLOY_ROLE_ARN is empty"
            exit 1
          fi

  # Bootstrap / keep CI bucket + GHA IAM before jar upload (full staging apply later).
  ensure-ci-bucket:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-terraform-aws
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - name: Apply CI bucket + GHA S3 IAM (staging stack)
        run: |
          make tf-init ENV=staging
          terraform -chdir=infra/terraform/stacks/staging apply -input=false -auto-approve \
            -target=aws_s3_bucket.gha_ci \
            -target=aws_s3_bucket_public_access_block.gha_ci \
            -target=aws_s3_bucket_server_side_encryption_configuration.gha_ci \
            -target=aws_s3_bucket_lifecycle_configuration.gha_ci \
            -target=aws_iam_role_policy.gha_deploy

  build:
    needs: ensure-ci-bucket
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: ./.github/actions/setup-java
        with:
          restore-s3-cache: "true"
      - name: Quality gates
        run: make check
      - name: Boot jars
        run: make jar
      - name: Upload boot jars to S3
        run: |
          DEST="s3://${CI_S3_BUCKET}/artifacts/${GITHUB_SHA}/"
          aws s3 cp apps/api/build/libs/med0001-api.jar "${DEST}med0001-api.jar"
          aws s3 cp apps/worker/build/libs/med0001-worker.jar "${DEST}med0001-worker.jar"
          echo "Jars: ${DEST}"
      - name: Save Gradle cache to S3
        if: success()
        run: scripts/ci-gradle-s3-cache.sh save

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-terraform-aws
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - name: Download boot jars from S3
        run: |
          DEST="s3://${CI_S3_BUCKET}/artifacts/${GITHUB_SHA}/"
          mkdir -p apps/api/build/libs apps/worker/build/libs
          aws s3 cp "${DEST}med0001-api.jar" apps/api/build/libs/
          aws s3 cp "${DEST}med0001-worker.jar" apps/worker/build/libs/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login ECR + push SHA images
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          API_REPO="${REGISTRY}/med0001-staging-api"
          WORKER_REPO="${REGISTRY}/med0001-staging-worker"
          docker buildx build --platform linux/arm64 -f apps/api/Dockerfile \
            -t "${API_REPO}:${GITHUB_SHA}" -t "${API_REPO}:staging" --push .
          docker buildx build --platform linux/arm64 -f apps/worker/Dockerfile \
            -t "${WORKER_REPO}:${GITHUB_SHA}" -t "${WORKER_REPO}:staging" --push .
      - name: Terraform apply staging (S3 state + lockfile)
        env:
          TF_VAR_image_tag: ${{ github.sha }}
        run: |
          make tf-init ENV=staging
          make tf-apply ENV=staging TF_ARGS="-auto-approve -input=false"
      - name: Rolling ECS deploy + wait stable
        run: |
          chmod +x scripts/deploy-ecs.sh
          scripts/deploy-ecs.sh staging
      - name: Smoke staging
        run: make smoke-remote HEALTH_URL=${{ env.STAGING_HEALTH_URL }}
        env:
          ATTEMPTS: "24"
          SLEEP_SECS: "15"

  tag-release:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create semver tag for manual prod promote
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Idempotent: this SHA already versioned → skip
          EXISTING="$(git tag --points-at "$FULL_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -n "$EXISTING" ]; then
            echo "SHA already tagged ${EXISTING} — skip"
            exit 0
          fi
          LATEST="$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -z "$LATEST" ]; then
            TAG="v0.1.0"
          else
            ver="${LATEST#v}"
            IFS=. read -r major minor patch <<<"$ver"
            TAG="v${major}.${minor}.$((patch + 1))"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$FULL_SHA" \
            -m "Staging OK ${FULL_SHA} (${LATEST:-none} → ${TAG}, run ${{ github.run_id }}). Promote: gh workflow run deploy-prod.yml -f tag=${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "Created ${TAG} → ${FULL_SHA} (prod: manual workflow_dispatch)"
