name: deploy-main

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  STAGING_HEALTH_URL: https://staging-core.api.nammamedmate.com/api/v1/health

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require AWS_DEPLOY_ROLE_ARN
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::vars.AWS_DEPLOY_ROLE_ARN is empty"
            exit 1
          fi

  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - name: Quality gates
        run: make check
      - name: Boot jars
        run: make jar
      - name: Stage jars for artifact
        run: |
          mkdir -p boot-jars
          cp apps/api/build/libs/med0001-api.jar boot-jars/
          cp apps/worker/build/libs/med0001-worker.jar boot-jars/
      - uses: actions/upload-artifact@v4
        with:
          name: boot-jars
          retention-days: 3
          if-no-files-found: error
          path: boot-jars/

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boot-jars
          path: boot-jars
      - name: Place jars for Docker context
        run: |
          mkdir -p apps/api/build/libs apps/worker/build/libs
          cp boot-jars/med0001-api.jar apps/api/build/libs/
          cp boot-jars/med0001-worker.jar apps/worker/build/libs/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: ./.github/actions/setup-terraform-aws
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - name: Login ECR + push SHA images
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          API_REPO="${REGISTRY}/med0001-staging-api"
          WORKER_REPO="${REGISTRY}/med0001-staging-worker"
          docker buildx build --platform linux/arm64 -f apps/api/Dockerfile \
            -t "${API_REPO}:${GITHUB_SHA}" -t "${API_REPO}:staging" --push .
          docker buildx build --platform linux/arm64 -f apps/worker/Dockerfile \
            -t "${WORKER_REPO}:${GITHUB_SHA}" -t "${WORKER_REPO}:staging" --push .
      - name: Terraform apply staging (S3 state + lockfile)
        env:
          TF_VAR_image_tag: ${{ github.sha }}
        run: |
          make tf-init ENV=staging
          make tf-apply ENV=staging TF_ARGS="-auto-approve -input=false"
      - name: Rolling ECS deploy + wait stable
        run: |
          chmod +x scripts/deploy-ecs.sh
          scripts/deploy-ecs.sh staging
      - name: Smoke staging
        run: make smoke-remote HEALTH_URL=${{ env.STAGING_HEALTH_URL }}
        env:
          ATTEMPTS: "24"
          SLEEP_SECS: "15"
