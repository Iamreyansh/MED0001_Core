name: deploy-main

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  STAGING_HEALTH_URL: https://staging-core.api.nammamedmate.com/api/v1/health
  PROD_HEALTH_URL: https://core.api.nammamedmate.com/api/v1/health

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require AWS_DEPLOY_ROLE_ARN
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::vars.AWS_DEPLOY_ROLE_ARN is empty; cannot deploy."
            echo "See docs/runbooks/github-setup.md"
            exit 1
          fi
          echo "Deploy role configured."

  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - name: Quality gates
        run: make check
      - name: Package Lambdas
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-zips
          retention-days: 7
          if-no-files-found: error
          path: |
            infra/lambda/api.zip
            infra/lambda/worker.zip

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-zips
          path: infra/lambda
      - uses: ./.github/actions/setup-terraform-aws
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - name: Deploy staging
        run: make deploy ENV=staging
      - name: Smoke staging
        run: make smoke-remote HEALTH_URL=${{ env.STAGING_HEALTH_URL }}

  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-zips
          path: infra/lambda
      - uses: ./.github/actions/setup-terraform-aws
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - name: Deploy prod
        run: make deploy ENV=prod
      - name: Smoke prod
        run: make smoke-remote HEALTH_URL=${{ env.PROD_HEALTH_URL }}

  release:
    needs: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: lambda-zips
          path: infra/lambda
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          NOTES="Deploy of ${GITHUB_SHA} (${SHA_SHORT}) via deploy-main.

          - Staging smoke: ${STAGING_HEALTH_URL}
          - Prod smoke: ${PROD_HEALTH_URL}
          - Lambdas published to alias live (not \$LATEST)"
          gh release create "$TAG" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --notes "$NOTES" \
            infra/lambda/api.zip \
            infra/lambda/worker.zip
