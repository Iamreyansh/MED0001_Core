name: Setup Terraform + AWS OIDC
description: Terraform 1.10.5 and assume deploy role in ap-south-1

inputs:
  role-to-assume:
    description: IAM role ARN for GitHub OIDC (AWS_DEPLOY_ROLE_ARN)
    required: true
  aws-region:
    description: AWS region
    required: false
    default: ap-south-1
  terraform-version:
    description: Terraform version
    required: false
    default: "1.10.5"

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
