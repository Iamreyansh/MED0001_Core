services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medmate
      POSTGRES_USER: medmate
      POSTGRES_PASSWORD: medmate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medmate -d medmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
