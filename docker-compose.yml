services:
  postgres:
    # PostGIS required for EPIC-011 STORY-004 geofence ST_Within
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: medmate
      POSTGRES_USER: medmate
      POSTGRES_PASSWORD: medmate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medmate -d medmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
